<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        display: grid;
        grid-template-columns: 2fr 2fr;
        grid-template-areas: "header header" "nav nav" "section aside" "article aside" "footer footer";
        gap: 0px;
        min-height: 100vh;
      }

      .container > header {
        color: green;
        display: grid;
        grid-area: header;
        text-align: center;
        border-bottom: 1px solid black;
      }

      .container > nav {
        color: blue;
        grid-area: nav;
        text-align: center;
        border-bottom: 1px solid black;
      }

      .container > section {
        color: blueviolet;
        grid-area: section;
        text-align: center;
        border-bottom: 1px solid black;
        border-right: 1px solid black;
      }

      .container > article {
        color: rgb(46, 150, 255);
        grid-area: article;
        text-align: center;
        border-bottom: 1px solid black;
        border-right: 1px solid black;
      }

      .container > aside {
        grid-area: aside;
        color: greenyellow;
        position: relative;
        /* top: 80px; */
        text-align: center;
        border-bottom: 1px solid black;
      }

      .container > aside > span {
        position: relative;
        top: 50px;
      }

      .container > footer {
        grid-area: footer;
        color: red;
        text-align: center;
      }

      .container header,
      nav,
      section,
      article,
      aside,
      footer {
        padding: 40px 25px 40px 25px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>&lt;Header&gt;</header>
      <nav>&lt;Navigation&gt;</nav>
      <section>&lt;Section&gt;</section>
      <article>&lt;Article&gt;</article>
      <aside><span>&lt;Aside&gt;</span></aside>
      <footer>&lt;Footer&gt;</footer>
    </div>
  </body>
</html>
