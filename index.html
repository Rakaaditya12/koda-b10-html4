<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Semantic</title>

    <style>
      * {
        margin: 0;
      }

      body {
        margin: 0;
      }

      .container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        /* padding: 20px 10px 20px 10px; */
        gap: 20px;
      }

      .container > div:nth-child(1) {
        border-bottom: 1px solid;
        text-align: center;
        padding: 30px 10px 30px 10px;
        height: 50px;
      }
      .container > div:nth-child(1) > header {
        color: green;
      }

      .container > div:nth-child(2) {
        border-bottom: 1px solid;
        text-align: center;
        padding: 30px 10px 30px 10px;
        height: 50px;
      }
      .container > div:nth-child(2) > nav {
        color: blue;
      }

      .container > div:nth-child(3) {
        border-bottom: 1px solid;
        /* padding: 30px 10px 30px 10px; */
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .container > div:nth-child(3) > div {
        display: flex;
        flex-direction: column;
        width: 60%;
      }
      .container > div:nth-child(3) > div > section {
        color: blueviolet;
        border-bottom: 1px solid black;
        padding: 30px;
        width: 60%;
      }
      .container > div:nth-child(3) > div > article {
        color: dodgerblue;
        padding: 30px;
      }
      .container > div:nth-child(3) > div > aside {
        color: greenyellow;
        border-bottom: 1px solid black;
      }

      .container > div:nth-child(4) {
        text-align: center;
        padding: 30px 10px 30px 10px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <header>&lt;Header&gt;</header>
      </div>
      <div>
        <nav>&lt;Nav&gt;</nav>
      </div>
      <div>
        <div>
          <section>&lt;Section&gt;</section>
          <article>&lt;Article&gt;</article>
        </div>
        <aside>&lt;Aside&gt;</aside>
      </div>
      <div>
        <footer>&lt;Footer&gt;</footer>
      </div>
    </div>
  </body>
</html>
